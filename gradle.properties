# Project-wide Gradle settings.
# D23: iron.version es el punto de verdad único del versionado.
iron.version=0.1.0

# El daemon comparte heap entre Kotlin, Lint y R8. Con 2048m el gate completo hace pausas de GC.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Cachés del bucle de pruebas: la configuración de AGP 9.4 (KSP, Room, Compose) se repite en cada
# invocación sin configuration cache, y sin build cache un clean vuelve a ejecutar todo.
# ktlint-gradle 14.2 no es compatible con configuration cache cuando el bloque ktlint tiene un
# filter personalizado con objetos del script; aquí no hay filter, por eso se puede activar.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.vfs.watch=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# D24: reglas de build reproducible. En AGP 9.4 el cruncher y el APK determinista solo se
# pueden fijar por propiedad; vcsInfo y las densidades ya no están en el DSL del bloque
# android (vcsInfo se pone en el build type, y no hay PNG en el repo, así que la regla de
# densidades se cumple de hecho). ArtProfile no existe como tarea en AGP 9.4.
android.enableResourceOptimizations=false
android.experimental.forceDeterministicApk=true
