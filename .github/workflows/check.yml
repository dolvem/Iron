# D49: un solo job check, en push y pull_request. CI no firma: genera el APK unsigned.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # actions/checkout v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6 # actions/setup-java v6
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v6 # actions/cache v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
            # Robolectric descarga android-all en ~/.m2; sin esta línea se descarga en cada run.
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      # D49: el gate es build, que ya depende de check (ktlintCheck, lint, test). Los cuatro
      # nombres se escriben igual por claridad, pero dentro de una invocación Gradle ejecuta
      # cada tarea una sola vez.
      - name: Check
        run: ./gradlew ktlintCheck lint test build
